# The action on every runner: a real heartbeat to the test monitor of mon.red (the secret MONRED_TEST_URL, its period is a day), and the
# errors without it. Every day too: when the action breaks or this schedule stops, the test monitor alerts.
name: Test

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    name: Heartbeat on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - id: start
        uses: ./
        with:
          url: ${{ secrets.MONRED_TEST_URL }}
          status: start
          fail-on-error: true

      - id: end
        uses: ./
        if: always()
        with:
          url: ${{ secrets.MONRED_TEST_URL }}
          status: ${{ job.status }}
          fail-on-error: true

      - name: Check the outputs
        shell: bash
        env:
          START_SENT: ${{ steps.start.outputs.sent }}
          END_SENT: ${{ steps.end.outputs.sent }}
          END_CODE: ${{ steps.end.outputs.response-code }}
        run: |
          test "$START_SENT" = true
          test "$END_SENT" = true
          test "$END_CODE" = 200

  errors:
    name: Errors on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # a token mon.red does not know: a warning, the step goes on
      - id: unknown
        uses: ./
        with:
          url: https://ping.mon.red/00000000000000000000000000000000

      # nobody answers: one retry, a warning, the step goes on
      - id: unreachable
        uses: ./
        with:
          url: http://127.0.0.1:9/00000000000000000000000000000000
          timeout: 3

      # the same with fail-on-error: the step fails
      - id: strict
        uses: ./
        continue-on-error: true
        with:
          url: http://127.0.0.1:9/00000000000000000000000000000000
          timeout: 3
          fail-on-error: true

      # wrong inputs always fail the step
      - id: empty
        uses: ./
        continue-on-error: true
        with:
          url: ''

      - id: wrong_status
        uses: ./
        continue-on-error: true
        with:
          url: https://ping.mon.red/00000000000000000000000000000000
          status: done

      - name: Check the outcomes
        shell: bash
        env:
          UNKNOWN_SENT: ${{ steps.unknown.outputs.sent }}
          UNKNOWN_CODE: ${{ steps.unknown.outputs.response-code }}
          UNREACHABLE_OUTCOME: ${{ steps.unreachable.outcome }}
          UNREACHABLE_SENT: ${{ steps.unreachable.outputs.sent }}
          UNREACHABLE_CODE: ${{ steps.unreachable.outputs.response-code }}
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          EMPTY_OUTCOME: ${{ steps.empty.outcome }}
          STATUS_OUTCOME: ${{ steps.wrong_status.outcome }}
        run: |
          test "$UNKNOWN_SENT" = false
          test "$UNKNOWN_CODE" = 404
          test "$UNREACHABLE_OUTCOME" = success
          test "$UNREACHABLE_SENT" = false
          test -z "$UNREACHABLE_CODE"
          test "$STRICT_OUTCOME" = failure
          test "$EMPTY_OUTCOME" = failure
          test "$STATUS_OUTCOME" = failure
